name: securite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique
      - name: Gitleaks sur tout l'historique
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --report-format json --report-path /repo/gitleaks.json
      - uses: actions/upload-artifact@v7
        if: always() # conserver le rapport même en échec
        with:
          name: rapport-gitleaks
          path: gitleaks.json
